name: Test with Service Account ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          yc-sa-id: 'fake-service-account-id'
          folder-id: 'fake-folder-id'
          function-name: 'test-function-sa-id'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
      - name: Assert action ran (SA ID provided)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with a fake SA ID
          # but it must have started (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with yc-sa-id and folder-id inputs"
