name: Test IAM token path fails at API call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fake IAM token (expect failure at API call)
        id: action
        uses: .
        with:
          yc-iam-token: 'fake-iam-token-for-testing'
          folder-id: 'test-folder-id'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '128Mb'
          execution-timeout: '5'
        continue-on-error: true

      - name: Assert action failed at API call (not at credential parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when using a fake IAM token against the real API"
            exit 1
          fi
          echo "PASS: action correctly failed when using fake IAM token (API rejected it)"
