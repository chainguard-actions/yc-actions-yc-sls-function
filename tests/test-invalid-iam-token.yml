name: Test - Invalid IAM token error
on:
  workflow_dispatch:

jobs:
  test-invalid-iam-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: 'invalid-fake-iam-token'
          folder-id: 'fake-folder-id'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '128Mb'
          execution-timeout: '5'

      - name: Assert action failed due to invalid IAM token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when invalid IAM token is provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid IAM token"
