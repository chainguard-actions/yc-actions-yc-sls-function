name: Test invalid IAM token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fake IAM token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: 'fake-iam-token-that-will-fail-api-auth'
          folder-id: 'b1g0000000000000000'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '128Mb'
          execution-timeout: '5'

      - name: Assert action failed due to invalid IAM token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when an invalid IAM token is provided, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when an invalid IAM token was provided"
