name: Test invalid IAM token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: 'invalid-iam-token-for-testing'
          folder-id: 'b1g0000000000000000'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '128Mb'
          execution-timeout: '5'

      - name: Assert action failed due to invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid IAM token"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid IAM token"
