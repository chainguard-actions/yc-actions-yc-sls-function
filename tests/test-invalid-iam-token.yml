name: Test invalid IAM token error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid IAM token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: 'invalid-fake-iam-token'
          folder-id: 'b1gfakefolderid123'
          function-name: 'test-function-name'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '128Mb'
          execution-timeout: '5'

      - name: Assert action failed due to invalid IAM token
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when an invalid IAM token is provided"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid IAM token"
