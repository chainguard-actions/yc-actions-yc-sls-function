name: Test - Source inputs and memory parsing
on:
  workflow_dispatch:

jobs:
  test-source-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: 'invalid-fake-iam-token'
          folder-id: 'fake-folder-id'
          function-name: 'test-function'
          runtime: 'python311'
          entrypoint: 'main.handler'
          memory: '256Mb'
          execution-timeout: '10'
          include: |
            .
          exclude: |
            .git
            node_modules
          source-root: '.'
          environment: |
            MY_VAR=hello
            ANOTHER_VAR=world
          tags: |
            latest
            v1

      - name: Assert action failed at API stage (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at API call with invalid token), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at API stage, confirming inputs were parsed successfully"
