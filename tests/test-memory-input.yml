name: Test memory input parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: 'fake-iam-token-for-testing'
          folder-id: 'b1gtest1234567890'
          function-name: 'test-function'
          runtime: 'nodejs20'
          entrypoint: 'index.handler'
          memory: '256Mb'
          execution-timeout: '10'
          environment: |
            MY_VAR=hello
            ANOTHER_VAR=world
      - name: Assert action failed at API stage (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake IAM token, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly processed inputs and failed at API stage"
