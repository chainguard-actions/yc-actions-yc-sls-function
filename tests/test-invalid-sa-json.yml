name: Test invalid SA JSON credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: '{"id":"test-id","service_account_id":"test-sa","created_at":"2024-01-01T00:00:00Z","key_algorithm":"RSA_2048","public_key":"-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0000\n-----END PUBLIC KEY-----\n","private_key":"-----BEGIN PRIVATE KEY-----\nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQC0000\n-----END PRIVATE KEY-----\n"}'
          folder-id: 'b1g0000000000000000'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '128Mb'
          execution-timeout: '5'

      - name: Assert action failed due to invalid SA JSON
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid SA JSON credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid SA JSON credentials"
