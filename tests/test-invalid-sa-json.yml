name: Test invalid SA JSON credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid SA JSON credentials (expect failure)
        id: action
        uses: .
        with:
          yc-sa-json-credentials: '{"invalid": "credentials"}'
          folder-id: 'test-folder-id'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '256Mb'
          execution-timeout: '10'
          environment: |
            KEY1=value1
            KEY2=value2
          tags: |
            latest
            v1
        continue-on-error: true
      - name: Assert action failed due to invalid SA JSON credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid SA JSON credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid SA JSON credentials"
