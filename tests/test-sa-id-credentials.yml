name: Test - SA ID credentials (workload identity)
on:
  workflow_dispatch:

jobs:
  test-sa-id-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-id: 'fake-service-account-id'
          folder-id: 'fake-folder-id'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '128Mb'
          execution-timeout: '5'

      - name: Assert action failed due to invalid SA ID (workload identity exchange fails)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when invalid yc-sa-id is provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid yc-sa-id (workload identity)"
