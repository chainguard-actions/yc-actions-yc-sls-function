name: Test fake IAM token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: 'fake-iam-token-that-will-not-work'
          folder-id: 'fake-folder-id'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '128Mb'
          execution-timeout: '5'
      - name: Assert action failed due to invalid IAM token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a fake IAM token is provided, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when a fake IAM token was provided"
