name: Test invalid SA ID error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid SA ID (expect failure)
        id: action
        uses: .
        with:
          yc-sa-id: 'aje0000000000000000'
          folder-id: 'b1gfake000000000000'
          function-name: 'test-function'
          runtime: 'nodejs20'
          entrypoint: 'index.handler'
        continue-on-error: true

      - name: Assert action failed due to invalid SA ID
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when an invalid SA ID is provided"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid SA ID"
