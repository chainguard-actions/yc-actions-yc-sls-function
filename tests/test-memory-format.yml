name: Test memory format validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid memory format (expect failure)
        id: action-bad-memory
        uses: .
        with:
          yc-iam-token: 'fake-iam-token-for-testing'
          folder-id: 'test-folder-id'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: 'invalid-memory-format'
        continue-on-error: true

      - name: Assert action failed due to invalid memory format
        run: |
          echo "outcome: ${{ steps.action-bad-memory.outcome }}"
          if [ "${{ steps.action-bad-memory.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid memory format"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid memory format"
