name: Test yc-sa-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          yc-sa-id: 'aje00000000000000000'
          folder-id: 'b1g00000000000000000'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
          memory: '128Mb'
          execution-timeout: '5'
        continue-on-error: true
      - name: Assert action ran with yc-sa-id input (expected to fail with auth error, not missing-credentials error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no real Yandex Cloud credentials),
          # but it must have attempted authentication via yc-sa-id,
          # not short-circuited with a "no credentials provided" error.
          # Either failure or success is acceptable here — what matters
          # is that the yc-sa-id input was accepted and processed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action processed yc-sa-id input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
