name: Test invalid JSON credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid JSON credentials (expect failure)
        id: action
        uses: .
        with:
          yc-sa-json-credentials: 'not-valid-json'
          folder-id: 'test-folder-id'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
        continue-on-error: true

      - name: Assert action failed due to invalid JSON
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when invalid JSON credentials are provided"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid JSON credentials"
