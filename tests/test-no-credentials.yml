name: Test no credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          folder-id: 'b1gtest1234567890'
          function-name: 'test-function'
          runtime: 'nodejs20'
          entrypoint: 'index.handler'
      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no credentials provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with no credentials"
