name: Test with IAM token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: 'fake-iam-token-value'
          folder-id: 'fake-folder-id'
          function-name: 'test-function-iam'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
      - name: Assert action ran (iam-token input covered)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with invalid credentials
          # but we verify the inputs were accepted (not a missing input error)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with yc-iam-token input"
