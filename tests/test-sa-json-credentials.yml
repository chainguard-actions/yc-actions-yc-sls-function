name: Test SA JSON credentials input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: '{"id":"fake-id","service_account_id":"fake-sa","created_at":"2024-01-01T00:00:00Z","key_algorithm":"RSA_2048","public_key":"fake-public-key","private_key":"fake-private-key"}'
          folder-id: 'fake-folder-id'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'
      - name: Assert action was invoked
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail due to invalid credentials,
          # but it must have been invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
