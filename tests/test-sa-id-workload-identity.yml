name: Test yc-sa-id workload identity input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with yc-sa-id (expect failure with fake SA ID)
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-id: 'aje00000000000000000'
          folder-id: 'b1g00000000000000000'
          function-name: 'test-function'
          runtime: 'nodejs18'
          entrypoint: 'index.handler'

      - name: Assert action failed due to invalid SA ID / workload identity error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when a fake yc-sa-id is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when an invalid yc-sa-id was provided"
